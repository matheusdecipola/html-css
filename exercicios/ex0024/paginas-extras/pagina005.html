<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javaScript</title>
</head>
<style>
    body{
        background-color: cadetblue;
    }
</style>
<body>
    <a href="#" onclick="clicou()">clique aqui</a>
    <div id="saida"></div>

    <script>
        function clicou() {
            s = window.document.getElementById("saida")
            s.innerHTML += "<p>Você clicou no link</p>"
        }
    </script>
</body>
</html>
